<svg viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Head -->
  <circle cx="100" cy="50" r="20" fill="#D4A574"/>
  
  <!-- Hair -->
  <path d="M 85 35 Q 85 25 100 25 Q 115 25 115 35" fill="#2C1810" stroke="none"/>
  <ellipse cx="100" cy="50" rx="20" ry="22" fill="#2C1810" opacity="0.4"/>
  
  <!-- Face -->
  <circle cx="100" cy="50" r="18" fill="#E8B8A0"/>
  
  <!-- Eyes -->
  <circle cx="93" cy="48" r="2" fill="#1a1a1a"/>
  <circle cx="107" cy="48" r="2" fill="#1a1a1a"/>
  
  <!-- Smile -->
  <path d="M 93 54 Q 100 57 107 54" stroke="#D4956E" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- Body/Torso - Arms up in celebration -->
  <rect x="90" y="70" width="20" height="35" fill="#8B4513" rx="3"/>
  
  <!-- Left Arm (up) -->
  <line x1="92" y1="72" x2="75" y2="45" stroke="#E8B8A0" stroke-width="6" stroke-linecap="round"/>
  <circle cx="75" cy="45" r="4" fill="#E8B8A0"/>
  
  <!-- Right Arm (up) -->
  <line x1="108" y1="72" x2="125" y2="45" stroke="#E8B8A0" stroke-width="6" stroke-linecap="round"/>
  <circle cx="125" cy="45" r="4" fill="#E8B8A0"/>
  
  <!-- Yellow/Gold pants -->
  <rect x="88" y="105" width="24" height="45" fill="#F4C430" rx="2"/>
  
  <!-- Left leg -->
  <rect x="88" y="150" width="8" height="60" fill="#E8B8A0" rx="2"/>
  <ellipse cx="92" cy="210" rx="6" ry="8" fill="#333333"/>
  
  <!-- Right leg -->
  <rect x="104" y="150" width="8" height="60" fill="#E8B8A0" rx="2"/>
  <ellipse cx="108" cy="210" rx="6" ry="8" fill="#333333"/>
  
  <!-- Motion lines to indicate jumping/celebration -->
  <line x1="130" y1="40" x2="145" y2="25" stroke="#E01A8A" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="128" y1="55" x2="148" y2="50" stroke="#E01A8A" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="70" y1="40" x2="55" y2="25" stroke="#E01A8A" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="72" y1="55" x2="52" y2="50" stroke="#E01A8A" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Decorative streamers/ribbons -->
  <path d="M 125 45 Q 135 50 130 65" stroke="#FF69B4" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M 75 45 Q 65 50 70 65" stroke="#FF69B4" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
</svg>
