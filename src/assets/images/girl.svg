<svg viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="drop-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" floodOpacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Head -->
  <circle cx="100" cy="50" r="20" fill="#D4A574"/>
  
  <!-- Hair -->
  <path d="M 85 35 Q 85 25 100 25 Q 115 25 115 35" fill="#2C1810" stroke="none"/>
  <ellipse cx="100" cy="50" rx="20" ry="22" fill="#2C1810" opacity="0.5"/>
  
  <!-- Face -->
  <circle cx="100" cy="50" r="18" fill="#E8B8A0"/>
  
  <!-- Eyes -->
  <circle cx="93" cy="48" r="2.5" fill="#1a1a1a"/>
  <circle cx="107" cy="48" r="2.5" fill="#1a1a1a"/>
  <!-- Eye shine -->
  <circle cx="94" cy="47" r="0.8" fill="#ffffff" opacity="0.8"/>
  <circle cx="108" cy="47" r="0.8" fill="#ffffff" opacity="0.8"/>
  
  <!-- Smile -->
  <path d="M 93 54 Q 100 57 107 54" stroke="#D4956E" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- Body/Torso -->
  <rect x="90" y="70" width="20" height="35" fill="#8B4513" rx="3"/>
  
  <!-- Left Arm (up in celebration) -->
  <line x1="92" y1="72" x2="70" y2="40" stroke="#E8B8A0" stroke-width="6" stroke-linecap="round"/>
  <circle cx="70" cy="40" r="5" fill="#E8B8A0"/>
  
  <!-- Right Arm (up in celebration) -->
  <line x1="108" y1="72" x2="130" y2="40" stroke="#E8B8A0" stroke-width="6" stroke-linecap="round"/>
  <circle cx="130" cy="40" r="5" fill="#E8B8A0"/>
  
  <!-- Yellow/Gold pants -->
  <path d="M 88 105 L 88 145 Q 88 150 92 150 L 108 150 Q 112 150 112 145 L 112 105 Z" fill="#F4C430" stroke="none"/>
  
  <!-- Left leg -->
  <rect x="87" y="150" width="9" height="55" fill="#E8B8A0" rx="2"/>
  <ellipse cx="91.5" cy="205" rx="6" ry="8" fill="#333333"/>
  
  <!-- Right leg -->
  <rect x="104" y="150" width="9" height="55" fill="#E8B8A0" rx="2"/>
  <ellipse cx="108.5" cy="205" rx="6" ry="8" fill="#333333"/>
  
  <!-- Motion lines to indicate jumping/celebration (left side) -->
  <line x1="65" y1="35" x2="50" y2="20" stroke="#E01A8A" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  <line x1="62" y1="52" x2="42" y2="45" stroke="#FF69B4" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  <line x1="68" y1="68" x2="52" y2="70" stroke="#E01A8A" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Motion lines to indicate jumping/celebration (right side) -->
  <line x1="135" y1="35" x2="150" y2="20" stroke="#E01A8A" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  <line x1="138" y1="52" x2="158" y2="45" stroke="#FF69B4" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  <line x1="132" y1="68" x2="148" y2="70" stroke="#E01A8A" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Decorative streamers/ribbons (left) -->
  <path d="M 70 40 Q 60 50 65 70" stroke="#FF1493" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.8" filter="url(#drop-shadow)"/>
  <path d="M 68 42 Q 55 55 62 75" stroke="#FF69B4" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.65"/>
  
  <!-- Decorative streamers/ribbons (right) -->
  <path d="M 130 40 Q 140 50 135 70" stroke="#FF1493" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.8" filter="url(#drop-shadow)"/>
  <path d="M 132 42 Q 145 55 138 75" stroke="#FF69B4" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.65"/>
  
  <!-- Sparkles/stars for celebration -->
  <g opacity="0.8">
    <path d="M 45 30 L 47 35 L 52 35 L 48 38 L 50 43 L 45 40 L 40 43 L 42 38 L 38 35 L 43 35 Z" fill="#FFD700"/>
    <path d="M 155 30 L 157 35 L 162 35 L 158 38 L 160 43 L 155 40 L 150 43 L 152 38 L 148 35 L 153 35 Z" fill="#FFD700"/>
    <circle cx="120" cy="25" r="1.5" fill="#FFD700" opacity="0.9"/>
    <circle cx="80" cy="25" r="1.5" fill="#FFD700" opacity="0.9"/>
  </g>
</svg>
